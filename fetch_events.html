<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practical 13 — Fetch API Asynchronous CRUD</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .loading-spin { color: #3498db; font-weight: bold; margin-bottom: 10px; display: none; }
        .btn-sm { padding: 4px 8px; font-size: 12px; margin-right: 4px; }
    </style>
</head>
<body>
<header>
    <h1>🎓 StudentHub</h1>
    <nav>
        <a href="events_crud.php">Standard CRUD</a>
        <a href="fetch_events.html"><strong>Fetch API CRUD (P13)</strong></a>
    </nav>
</header>

<main class="container" style="max-width:900px;">
    <!-- Form Card -->
    <div class="form-card">
        <h2>⚡ Event Operations (Zero Page Reload)</h2>
        <div id="api-alert" style="display:none; padding:10px 14px; border-radius:5px; margin-bottom:15px;"></div>

        <form id="event-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="event_id" value="0">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>Event Title *</label>
                    <input type="text" id="title" required placeholder="e.g. AI Hackathon 2026">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="event_type">
                        <option value="Academic">Academic</option>
                        <option value="Technical">Technical</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="event_date" value="2026-11-20">
                </div>
                <div class="form-group">
                    <label>Venue</label>
                    <input type="text" id="venue" placeholder="e.g. Lab 3 / Auditorium">
                </div>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary">Create Event (AJAX POST)</button>
            <button type="button" id="cancel-btn" style="display:none;" onclick="resetForm()" class="btn">Cancel Edit</button>
        </form>
    </div>

    <!-- Live Table Card -->
    <div class="form-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h2>📋 Live Events (Fetch API)</h2>
            <div id="loader" class="loading-spin">⏳ Requesting API...</div>
        </div>

        <!-- Debounced Live Search (Intermediate Requirement) -->
        <div class="form-group">
            <input type="text" id="search-input" placeholder="🔍 Search live with debounce (300ms)..." oninput="debouncedSearch(this.value)">
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr><th>ID</th><th>Title</th><th>Category</th><th>Date</th><th>Venue</th><th>Actions</th></tr>
                </thead>
                <tbody id="events-tbody"></tbody>
            </table>
        </div>
    </div>
</main>

<footer><p>&copy; 2026 StudentHub. Practical 13 — Fetch API CRUD.</p></footer>

<script>
const API_URL = 'api_events.php';
let debounceTimer;

function showMsg(text, isSuccess = true) {
    const alertBox = document.getElementById('api-alert');
    alertBox.style.display = 'block';
    alertBox.className = isSuccess ? 'msg-success' : 'msg-error';
    alertBox.innerText = text;
    setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
}

function setLoader(loading) {
    document.getElementById('loader').style.display = loading ? 'block' : 'none';
}

// GET: Load Events
async function loadEvents(query = '') {
    setLoader(true);
    try {
        const res = await fetch(`${API_URL}?search=${encodeURIComponent(query)}`);
        const json = await res.json();
        const tbody = document.getElementById('events-tbody');
        tbody.innerHTML = '';

        if (!json.data || json.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No events found.</td></tr>';
            return;
        }

        json.data.forEach(e => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${e.event_id}</td>
                <td><strong>${e.title}</strong></td>
                <td>${e.event_type}</td>
                <td>${e.event_date}</td>
                <td>${e.venue || '-'}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="startEdit(${e.event_id}, '${escapeQuotes(e.title)}', '${escapeQuotes(e.venue || '')}')">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteEvent(${e.event_id})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        showMsg('Failed to load events: ' + err.message, false);
    } finally {
        setLoader(false);
    }
}

// POST or PUT: Submit Form without reload
async function handleFormSubmit(e) {
    e.preventDefault();
    const id = parseInt(document.getElementById('event_id').value);
    const title = document.getElementById('title').value;
    const type = document.getElementById('event_type').value;
    const date = document.getElementById('event_date').value;
    const venue = document.getElementById('venue').value;

    setLoader(true);
    try {
        if (id === 0) {
            // POST
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, event_type: type, event_date: date, venue })
            });
            const data = await res.json();
            showMsg(data.data.message || 'Event added successfully!');
        } else {
            // PUT
            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ event_id: id, title, venue })
            });
            const data = await res.json();
            showMsg('Event updated via AJAX!');
        }
        resetForm();
        loadEvents();
    } catch(err) {
        showMsg('Error saving event: ' + err.message, false);
    } finally {
        setLoader(false);
    }
}

// DELETE: Async Delete
async function deleteEvent(id) {
    if (!confirm('Are you sure you want to delete this event via Fetch API?')) return;
    setLoader(true);
    try {
        const res = await fetch(API_URL, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_id: id })
        });
        const data = await res.json();
        showMsg(data.data || 'Deleted!');
        loadEvents();
    } catch(err) {
        showMsg('Delete error: ' + err.message, false);
    } finally {
        setLoader(false);
    }
}

// Debounce search (Intermediate)
function debouncedSearch(val) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadEvents(val), 300);
}

function startEdit(id, title, venue) {
    document.getElementById('event_id').value = id;
    document.getElementById('title').value = title;
    document.getElementById('venue').value = venue;
    document.getElementById('submit-btn').innerText = 'Update Event (AJAX PUT)';
    document.getElementById('cancel-btn').style.display = 'inline-block';
}

function resetForm() {
    document.getElementById('event_id').value = 0;
    document.getElementById('title').value = '';
    document.getElementById('venue').value = '';
    document.getElementById('submit-btn').innerText = 'Create Event (AJAX POST)';
    document.getElementById('cancel-btn').style.display = 'none';
}

function escapeQuotes(str) {
    return (str || '').replace(/'/g, "\\'");
}

document.addEventListener('DOMContentLoaded', () => loadEvents());
</script>
</body>
</html>
